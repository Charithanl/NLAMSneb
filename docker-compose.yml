services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: nlams-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - nlams_postgis_data:/var/lib/postgresql/data
      - ./NLAMS_Dataset_A_FINAL_WITH_SYNTHETIC_DEMO/postgis/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./backend/migrations/001_operational_schema.sql:/docker-entrypoint-initdb.d/002_operational_schema.sql:ro
      - ./backend/migrations/002_auth_schema.sql:/docker-entrypoint-initdb.d/003_auth_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  nlams_postgis_data:
